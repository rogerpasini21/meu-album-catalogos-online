name: Publicar pacotes Brasileirão verificados
on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "tools/build_brasileirao.py"
      - ".github/workflows/publish-brasileirao.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Gerar ZIPs e atualizar índice com hashes
        run: python tools/build_brasileirao.py
      - name: Publicar todos os pacotes de uma vez
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add albums/panini-brasileirao-*.zip packages.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publicar 29 Brasileirões online com os hashes corretos'
            git push origin HEAD:main
          fi
